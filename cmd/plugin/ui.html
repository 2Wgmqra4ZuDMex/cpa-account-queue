<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号并发与排队</title>
<style>
:root{color-scheme:light dark;--bg:#edf2f6;--panel:#fff;--ink:#213c50;--secondary:#536e80;--line:#c8d6e0;--action:#126596;--field:#f5f8fb;--danger:#ac3249;--active:#267c70}
@media(prefers-color-scheme:dark){:root{--bg:#152735;--panel:#1c3343;--ink:#e3eef5;--secondary:#abc1cf;--line:#395565;--action:#83c9f2;--field:#162c3a;--danger:#ffadb9;--active:#83d4bf}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1120px;margin:0 auto;padding:32px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:1.7rem;letter-spacing:-.03em;margin:0}p{color:var(--secondary);margin:.5em 0}h2{font-size:1.05rem;margin:0 0 12px}section{background:var(--panel);padding:20px;margin:20px 0;border-radius:8px}.auth{display:flex;gap:12px;align-items:end;flex-wrap:wrap}label{display:grid;gap:5px;font-size:.88rem;color:var(--secondary)}input,button{font:inherit}input{background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px;min-width:0}input[type=password]{width:min(100%,380px)}button{padding:8px 14px;border:1px solid var(--action);border-radius:4px;background:transparent;color:var(--action);cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible{outline:3px solid var(--action);outline-offset:2px}.muted{font-size:.85rem;color:var(--secondary)}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.status{padding:12px 0;color:var(--secondary)}.status[data-error=true]{color:var(--danger)}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{font-size:.83rem;font-weight:600;color:var(--secondary);text-align:left}td,th{padding:12px 10px;border-bottom:1px solid var(--line)}td:first-child{min-width:160px;white-space:normal;overflow-wrap:anywhere}td input[type=number]{width:76px}td input[type=checkbox]{width:18px;height:18px;accent-color:var(--action)}.meter{display:flex;gap:3px;align-items:center;min-height:24px;max-width:140px;flex-wrap:wrap}.slot{height:9px;width:12px;background:var(--line);border-radius:2px}.slot.active{background:var(--active)}.count{font-variant-numeric:tabular-nums;font-weight:600}.defaults{display:flex;gap:18px;flex-wrap:wrap}.defaults input{width:100px}.footer{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:18px;flex-wrap:wrap}.empty{padding:28px 10px;color:var(--secondary)}@media(max-width:600px){main{padding:20px 12px}section{padding:14px}header{align-items:start;flex-direction:column}h1{font-size:1.4rem}}
</style></head><body><main>
<header><div><h1>账号并发与排队</h1><p>每个上游账号，独立限额。执行与等待分开计数。</p></div><span class="muted">本地模式 · 开发预览</span></header>
<section><form class="auth" id="auth"><label for="key">CPA 管理密钥<input type="password" id="key" autocomplete="off" required></label><button>连接并读取</button><button type="button" id="disconnect">清除密钥</button></form><p class="muted">密钥仅保存在当前页面内存中，不写入浏览器存储。请通过 HTTPS 使用。</p></section>
<div id="status" class="status" role="status" aria-live="polite">输入管理密钥后读取账号。尚未连接。</div>
<section><h2>默认策略</h2><div class="defaults" id="defaults"></div><p class="muted">未设置独立策略的账号继承默认值。暂停接单不打断正在执行的请求。</p></section>
<section><div class="toolbar"><h2 style="margin:0">上游账号</h2><button id="refresh" type="button">刷新状态</button><span id="runtime" class="muted"></span></div>
<div class="table-wrap"><table><thead><tr><th>账号</th><th>执行中</th><th>排队中</th><th>最久等待</th><th>独立策略</th><th>并发上限</th><th>排队上限</th><th>等待秒数</th><th>暂停</th></tr></thead><tbody id="accounts"><tr><td colspan="9" class="empty">尚未读取账号。</td></tr></tbody></table></div>
<div class="footer"><span class="muted">降低限额后，已有请求自然结束；不清空执行计数。</span><button id="save" type="button">保存策略</button></div></section>
<p class="muted">队列和执行占用不跨 CPA 重启恢复。热替换前需排空请求。请勿与另一个并发控制插件同时启用。</p>
</main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),base='/v0/management/plugins/cpa-account-queue';let key='',config=null,revision='',snapshot=null,dirty=false,busy=false;
const message=(s,error=false)=>{$('status').textContent=s;$('status').dataset.error=String(error)};
async function api(path,method='GET',body){const r=await fetch(base+path,{method,cache:'no-store',credentials:'same-origin',headers:{'X-Management-Key':key,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const j=await r.json();if(!r.ok)throw Error(r.status===401||r.status===403?'管理密钥无效或访问未获授权。':j.error||'请求失败：'+r.status);return j}
function number(value,min,max,label){const input=document.createElement('input');input.type='number';input.value=value;input.min=min;input.max=max;input.step=1;input.setAttribute('aria-label',label);input.addEventListener('input',()=>{dirty=true});return input}
function policyFields(p,prefix){return [number(p.max_concurrency,1,1000,prefix+'并发上限'),number(p.max_queue,0,1000,prefix+'排队上限'),number(p.wait_timeout_ms/1000,.001,600,prefix+'等待秒数')].map((x,i)=>{if(i===2)x.step='.001';return x})}
function readFields(fields,paused){const [c,q,w]=fields.map(x=>Number(x.value));if(fields.some(x=>!x.checkValidity())||!Number.isInteger(c)||!Number.isInteger(q)||!Number.isInteger(w*1000))throw Error('请检查限额与等待时间。');return {max_concurrency:c,max_queue:q,wait_timeout_ms:Math.round(w*1000),paused}}
let defaultFields=[],rows=[];
function renderEditor(){defaultFields=policyFields(config.defaults,'默认');$('defaults').replaceChildren();['并发上限','排队上限','最长等待（秒）'].forEach((text,i)=>{const l=document.createElement('label');l.textContent=text;l.append(defaultFields[i]);$('defaults').append(l)});const pause=document.createElement('input');pause.type='checkbox';pause.checked=config.defaults.paused;pause.id='default-pause';pause.onchange=()=>dirty=true;const l=document.createElement('label');l.textContent='暂停默认账号';l.append(pause);$('defaults').append(l);renderRows()}
function renderRows(){const byID=new Map((snapshot.account_index||[]).map(a=>[a.id,a]));rows=[];$('accounts').replaceChildren();const accounts=snapshot.runtime.accounts;
if(!accounts.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=9;td.className='empty';td.textContent='暂无账号。请在 CPA 中添加凭证，再刷新。';tr.append(td);$('accounts').append(tr)}
for(const a of accounts){const info=byID.get(a.id)||{},tr=document.createElement('tr'),cells=Array.from({length:9},()=>document.createElement('td'));cells[0].textContent=info.label||info.name||a.id;if(info.disabled||info.unavailable){const note=document.createElement('div');note.className='muted';note.textContent='CPA 标记不可用';cells[0].append(note)}const count=document.createElement('span');count.className='count';count.textContent=a.in_flight+' / '+a.policy.max_concurrency;cells[1].append(count);const meter=document.createElement('div');meter.className='meter';meter.setAttribute('aria-hidden','true');for(let i=0;i<Math.min(a.policy.max_concurrency,20);i++){const dot=document.createElement('i');dot.className='slot'+(i<a.in_flight?' active':'');meter.append(dot)}cells[1].append(meter);cells[2].textContent=a.queued+' / '+a.policy.max_queue;cells[3].textContent=(a.oldest_wait_ms/1000).toFixed(1)+' 秒';const override=document.createElement('input');override.type='checkbox';override.checked=Object.hasOwn(config.accounts,a.id);override.setAttribute('aria-label','为 '+(info.name||a.id)+' 使用独立策略');cells[4].append(override);const fields=policyFields(config.accounts[a.id]||config.defaults,info.name||a.id);fields.forEach((x,i)=>{x.disabled=!override.checked;cells[5+i].append(x)});const paused=document.createElement('input');paused.type='checkbox';paused.checked=(config.accounts[a.id]||config.defaults).paused;paused.disabled=!override.checked;paused.setAttribute('aria-label','暂停 '+(info.name||a.id));paused.onchange=()=>dirty=true;cells[8].append(paused);override.onchange=()=>{dirty=true;fields.forEach(x=>x.disabled=!override.checked);paused.disabled=!override.checked};tr.append(...cells);$('accounts').append(tr);rows.push({id:a.id,override,fields,paused})}
$('runtime').textContent=snapshot.runtime.draining?'正在排空，暂停接单':'总排队 '+snapshot.runtime.waiting+' / '+snapshot.runtime.global_queue_limit}
async function load(all){if(busy)return;busy=true;try{if(!key)throw Error('请先输入管理密钥。');if(all){const data=await api('/config');config=data.config;revision=data.revision;dirty=false}snapshot=await api('/status');if(all)renderEditor();else if(!dirty)renderRows();message(snapshot.account_index_available?'已连接。状态已更新。':snapshot.account_index_error,!snapshot.account_index_available)}catch(e){message(e.message,true)}finally{busy=false}}
$('auth').onsubmit=async e=>{e.preventDefault();if(dirty&&!confirm('重新读取会放弃未保存的策略，继续吗？'))return;key=$('key').value.trim();await load(true)};
$('refresh').onclick=()=>load(false);$('disconnect').onclick=()=>{key='';$('key').value='';config=null;revision='';snapshot=null;rows=[];dirty=false;$('accounts').replaceChildren();$('defaults').replaceChildren();$('runtime').textContent='';message('密钥已清除。')};
$('save').onclick=async()=>{if(busy||!config)return;busy=true;$('save').disabled=true;try{const next=structuredClone(config);next.defaults=readFields(defaultFields,$('default-pause').checked);for(const r of rows){if(r.override.checked)next.accounts[r.id]=readFields(r.fields,r.paused.checked);else delete next.accounts[r.id]}const result=await api('/config','PUT',{revision,config:next});config=result.config;revision=result.revision;dirty=false;message('策略已保存。');}catch(e){message(e.message,true)}finally{busy=false;$('save').disabled=false}if(!dirty)await load(false)};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
})();
</script></body></html>
