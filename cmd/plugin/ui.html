<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号并发与排队</title>
<style>
:root{color-scheme:light;--bg:#faf9f5;--panel:#f0eee8;--ink:#2d2a26;--secondary:#6d6760;--line:#e3e1db;--action:#8b8680;--field:#faf9f5;--danger:#c65746;--active:#10b981;--hover:#e9e6df;--radius:8px}
:root[data-theme=dark]{color-scheme:dark;--bg:#151412;--panel:#1d1b18;--ink:#f6f4f1;--secondary:#c9c3bb;--line:#3a3530;--action:#8b8680;--field:#151412;--danger:#c65746;--active:#0fae78;--hover:#2e2a26}
:root[data-theme=white]{--bg:#fff;--panel:#fff;--field:#fff;--line:#e5e5e5;--hover:#f6f6f6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif}main{max-width:1280px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:1.5rem;margin:0}p{color:var(--secondary);margin:.5em 0}h2{font-size:1.05rem;margin:0 0 12px}section{background:var(--panel);border:1px solid var(--line);padding:20px;margin:20px 0;border-radius:var(--radius)}.auth{display:flex;gap:12px;align-items:end;flex-wrap:wrap}label{display:grid;gap:5px;font-size:.88rem;color:var(--secondary)}input,button{font:inherit}input{background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px;min-width:0}input[type=password]{width:min(100%,380px)}input[type=checkbox]{width:18px;height:18px;accent-color:var(--action)}.check{display:flex;align-items:center;gap:8px;min-height:42px}button{padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer}button:hover{background:var(--hover)}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid var(--action);outline-offset:2px}.muted{font-size:.85rem;color:var(--secondary)}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.toolbar .interval{display:flex;gap:8px;align-items:center}.interval input{width:80px}.status{padding:8px 0;color:var(--secondary)}.status[data-error=true]{color:var(--danger)}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{font-size:.83rem;font-weight:600;color:var(--secondary);text-align:left}td,th{padding:12px 10px;border-bottom:1px solid var(--line)}td:first-child{min-width:160px;white-space:normal;overflow-wrap:anywhere}td input[type=number]{width:76px}.meter{display:flex;gap:3px;align-items:center;min-height:24px;max-width:140px;flex-wrap:wrap}.slot{height:9px;width:12px;background:var(--line);border-radius:2px}.slot.active{background:var(--active)}.count{font-variant-numeric:tabular-nums;font-weight:600}.defaults{display:flex;gap:18px;flex-wrap:wrap}.defaults input[type=number]{width:100px}.footer{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:18px;flex-wrap:wrap}.empty{padding:28px 10px;color:var(--secondary)}@media(max-width:600px){main{padding:20px 12px}section{padding:14px}header{align-items:start;flex-direction:column}h1{font-size:1.4rem}}
.account-heading{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.provider-badge{display:inline-block;background:var(--hover);color:var(--ink);border-radius:4px;padding:2px 7px;font-size:.78rem;white-space:nowrap}
</style></head><body><main>
<header><div><h1>账号并发与排队</h1><p>每个上游账号，独立限额。执行与等待分开计数。</p></div><span class="muted">本地模式 · 开发预览</span></header>
<section><form class="auth" id="auth"><label for="key">CPA 管理密钥<input type="password" id="key" autocomplete="off" required></label><label class="check"><input type="checkbox" id="remember">记住本次会话</label><button id="connect">连接并读取</button><button type="button" id="disconnect">清除密钥</button></form><p id="session-note" class="muted">勾选后刷新或重新进入本标签页无需重复输入；密钥仅存于本次浏览器会话，可随时清除。</p></section>
<div id="status" class="status" role="status" aria-live="polite">输入管理密钥后读取账号。尚未连接。</div>
<section><h2>默认策略</h2><div class="defaults" id="defaults"></div><p class="muted">未设置独立策略的账号继承默认值。暂停接单不打断正在执行的请求。</p></section>
<section><div class="toolbar"><h2 style="margin:0">上游账号</h2><label class="check"><input type="checkbox" id="auto" checked>自动刷新</label><label class="interval" for="interval">间隔<input id="interval" type="number" min="1" max="300" step="1" value="5">秒</label><button id="refresh" type="button">立即刷新</button><span id="updated" class="muted"></span></div><p id="runtime" class="muted"></p>
<div class="table-wrap"><table><thead><tr><th>账号</th><th>执行中</th><th>排队中</th><th>最久等待</th><th>独立策略</th><th>并发上限</th><th>排队上限</th><th>等待秒数</th><th>暂停</th></tr></thead><tbody id="accounts"><tr><td colspan="9" class="empty">尚未读取账号。</td></tr></tbody></table></div>
<div class="footer"><span id="draft-note" class="muted">自动刷新仅更新运行状态，不覆盖策略编辑。</span><button id="save" type="button" disabled>保存策略</button></div></section>
<p class="muted">队列和执行占用不跨 CPA 重启恢复。热替换前需排空请求。请勿与另一个并发控制插件同时启用。</p>
</main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),base='/v0/management/plugins/cpa-account-queue';
const sessionKey='cpa-account-queue.session-key',prefsKey='cpa-account-queue.refresh';
let key='',config=null,revision='',snapshot=null,dirty=false,busy=false,connected=false,timer=null,generation=0,controller=null;
let defaultFields=[],rows=new Map();

// Same-origin CPA embeds expose CSS variables on the parent root. Copy only
// theme tokens; never inspect the parent's auth store or browser storage.
const media=window.matchMedia('(prefers-color-scheme: dark)');
function syncTheme(){
 const root=document.documentElement;let parentRoot=null;
 try{if(window.parent!==window)parentRoot=window.parent.document.documentElement}catch(_){/* Cross-origin standalone fallback. */}
 root.dataset.theme=parentRoot?(parentRoot.getAttribute('data-theme')||'light'):(media.matches?'dark':'white');
 if(parentRoot){const style=window.parent.getComputedStyle(parentRoot);const tokens={'--bg':'--bg-secondary','--panel':'--bg-primary','--ink':'--text-primary','--secondary':'--text-secondary','--line':'--border-color','--action':'--primary-color','--field':'--bg-secondary','--danger':'--error-color','--active':'--viz-success','--hover':'--bg-hover','--radius':'--radius-md'};for(const [dest,source]of Object.entries(tokens)){const value=style.getPropertyValue(source).trim();if(value)root.style.setProperty(dest,value)}try{document.body.style.fontFamily=window.parent.getComputedStyle(window.parent.document.body).fontFamily}catch(_){}}
 return parentRoot;
}
const parentRoot=syncTheme();let themeObserver;
if(parentRoot){themeObserver=new MutationObserver(syncTheme);themeObserver.observe(parentRoot,{attributes:true,attributeFilter:['data-theme','class','style']})}
media.addEventListener('change',syncTheme);

const message=(s,error=false)=>{$('status').textContent=s;$('status').dataset.error=String(error)};
function markDirty(){dirty=true;$('draft-note').textContent='有未保存的策略修改；运行状态继续自动更新。'}
function storageGet(name){try{return sessionStorage.getItem(name)}catch(_){return null}}
function storageRemove(name){try{sessionStorage.removeItem(name);return true}catch(_){return false}}
function rememberKey(){
 if(!$('remember').checked){if(!storageRemove(sessionKey))$('session-note').textContent='浏览器阻止会话存储访问，无法确认清除；请关闭此标签页。';return}
 if(!connected||!key)return;
 try{sessionStorage.setItem(sessionKey,key);$('session-note').textContent='已记住本次会话，刷新页面后将自动连接。可随时清除密钥。'}catch(_){$('remember').checked=false;$('session-note').textContent='浏览器不允许会话存储，本次仅在页面内存中保留密钥。'}
}
function stopTimer(){if(timer!==null)clearTimeout(timer);timer=null}
function seconds(){const n=Number($('interval').value);return Number.isInteger(n)&&n>=1&&n<=300?n:null}
function schedule(){stopTimer();const s=seconds();if(connected&&key&&$('auto').checked&&s!==null&&!document.hidden)timer=setTimeout(()=>load(false),s*1000)}
function savePrefs(){const s=seconds();if(s===null){$('interval').setCustomValidity('请输入 1–300 之间的整数秒');$('interval').reportValidity();stopTimer();return}$('interval').setCustomValidity('');try{sessionStorage.setItem(prefsKey,JSON.stringify({seconds:s,auto:$('auto').checked}))}catch(_){}schedule()}
function invalidate(){generation++;controller?.abort();controller=null;busy=false;stopTimer()}
async function api(path,method='GET',body){
 const current=key;controller=new AbortController();const ownController=controller;const timeout=setTimeout(()=>ownController.abort(),15000);
 try{const response=await fetch(base+path,{method,signal:ownController.signal,cache:'no-store',credentials:'same-origin',headers:{'X-Management-Key':current,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});let data;try{data=await response.json()}catch(_){throw Error('服务器未返回有效 JSON。')}
 if(!response.ok){const error=Error(response.status===401||response.status===403?'管理密钥无效或访问未获授权，请重新连接。':data.error||'请求失败：'+response.status);error.status=response.status;throw error}return data;
 }finally{clearTimeout(timeout);if(controller===ownController)controller=null}
}
function failed(error){if(error.status===401||error.status===403){connected=false;storageRemove(sessionKey);key='';$('key').value='';$('save').disabled=true;stopTimer()}message(error.name==='AbortError'?'请求超时，请稍后重试。':error.message,true)}
function number(value,min,max,label){const input=document.createElement('input');input.type='number';input.value=value;input.min=min;input.max=max;input.step=1;input.setAttribute('aria-label',label);input.addEventListener('input',markDirty);return input}
function policyFields(p,prefix){return[number(p.max_concurrency,1,1000,prefix+'并发上限'),number(p.max_queue,0,1000,prefix+'排队上限'),number(p.wait_timeout_ms/1000,.001,600,prefix+'等待秒数')].map((x,i)=>{if(i===2)x.step='.001';return x})}
function readFields(fields,paused){const[c,q,w]=fields.map(x=>Number(x.value));if(fields.some(x=>!x.checkValidity())||!Number.isInteger(c)||!Number.isInteger(q))throw Error('请检查限额与等待时间。');return{max_concurrency:c,max_queue:q,wait_timeout_ms:Math.round(w*1000),paused}}
function renderEditor(){
 defaultFields=policyFields(config.defaults,'默认');$('defaults').replaceChildren();['并发上限','排队上限','最长等待（秒）'].forEach((text,i)=>{const l=document.createElement('label');l.textContent=text;l.append(defaultFields[i]);$('defaults').append(l)});
 const pause=document.createElement('input');pause.type='checkbox';pause.checked=config.defaults.paused;pause.id='default-pause';pause.setAttribute('aria-label','暂停默认账号');pause.onchange=markDirty;const l=document.createElement('label');l.textContent='暂停默认账号';l.append(pause);$('defaults').append(l);
 rows=new Map();$('accounts').replaceChildren();renderStatus();$('save').disabled=false;
}
function providerLabel(info){
 const raw=typeof info.provider==='string'?info.provider.trim():'';
 const names={antigravity:'Antigravity',claude:'Claude',kimi:'Kimi','kimi-code':'Kimi Code',codex:'Codex',gemini:'Gemini','gemini-cli':'Gemini CLI',openai:'OpenAI','openai-compatibility':'OpenAI 兼容'};
 return raw?(names[raw.toLowerCase()]||raw):'未知平台';
}
function makeRow(a,info){
 const tr=document.createElement('tr'),cells=Array.from({length:9},()=>document.createElement('td'));
 const heading=document.createElement('div');heading.className='account-heading';const provider=document.createElement('span');provider.className='provider-badge';const name=document.createElement('span');heading.append(provider,name);cells[0].append(heading);
 const note=document.createElement('div');note.className='muted';cells[0].append(note);
 const override=document.createElement('input');override.type='checkbox';override.checked=Object.hasOwn(config.accounts,a.id);override.setAttribute('aria-label','为 '+(info.name||a.id)+' 使用独立策略');cells[4].append(override);
 const fields=policyFields(config.accounts[a.id]||config.defaults,info.name||a.id);fields.forEach((x,i)=>{x.disabled=!override.checked;cells[5+i].append(x)});
 const paused=document.createElement('input');paused.type='checkbox';paused.checked=(config.accounts[a.id]||config.defaults).paused;paused.disabled=!override.checked;paused.setAttribute('aria-label','暂停 '+(info.name||a.id));paused.onchange=markDirty;cells[8].append(paused);
 override.onchange=()=>{markDirty();fields.forEach(x=>x.disabled=!override.checked);paused.disabled=!override.checked};
 tr.append(...cells);$('accounts').append(tr);const row={id:a.id,tr,cells,name,provider,note,override,fields,paused};rows.set(a.id,row);return row;
}
function renderStatus(){
 const byID=new Map((snapshot.account_index||[]).map(a=>[a.id,a]));const present=new Set();$('accounts').querySelector('.empty-row')?.remove();
 for(const a of snapshot.runtime.accounts){present.add(a.id);const info=byID.get(a.id)||{},row=rows.get(a.id)||makeRow(a,info);row.name.textContent=info.label||info.name||a.id;row.provider.textContent=providerLabel(info);row.provider.title='CPA 凭据平台：'+(info.provider||'未提供');row.note.textContent=info.disabled||info.unavailable?'CPA 标记不可用':'';
 row.cells[1].textContent=a.in_flight+' / '+a.policy.max_concurrency;row.cells[1].className='count';row.cells[2].textContent=a.queued+' / '+a.policy.max_queue;row.cells[3].textContent=(a.oldest_wait_ms/1000).toFixed(1)+' 秒';
 }
 // Retain drafts for accounts that disappear while the user edits them.
 for(const[id,row]of rows)if(!present.has(id)){row.note.textContent='本次状态中未返回该账号';row.cells[1].textContent='—';row.cells[2].textContent='—';row.cells[3].textContent='—'}
 if(!rows.size){const tr=document.createElement('tr'),td=document.createElement('td');tr.className='empty-row';td.colSpan=9;td.className='empty';td.textContent='暂无账号。请在 CPA 中添加凭证。';tr.append(td);$('accounts').append(tr)}
 $('runtime').textContent=snapshot.runtime.draining?'正在排空，暂停接单':'总排队 '+snapshot.runtime.waiting+' / '+snapshot.runtime.global_queue_limit;
 $('updated').textContent='更新于 '+new Date().toLocaleTimeString();
}
async function load(all){
 if(busy)return;stopTimer();if(!key){message('请先输入管理密钥。',true);return}busy=true;const epoch=generation;
 try{let policies;if(all)policies=await api('/policies');if(epoch!==generation)return;const latest=await api('/status');if(epoch!==generation)return;
 snapshot=latest;if(all){config=policies.config;revision=policies.revision;dirty=false;$('draft-note').textContent='自动刷新仅更新运行状态，不覆盖策略编辑。';renderEditor()}else renderStatus();connected=true;rememberKey();
 message(latest.account_index_available?'已连接。'+(dirty?'未保存的编辑已保留。':'状态已更新。'):latest.account_index_error,!latest.account_index_available);
 }catch(error){if(epoch===generation)failed(error)}finally{if(epoch===generation){busy=false;schedule()}}
}
$('auth').onsubmit=async e=>{e.preventDefault();if(dirty&&!confirm('重新读取会放弃未保存的策略，继续吗？'))return;invalidate();connected=false;key=$('key').value.trim();await load(true)};
$('remember').onchange=rememberKey;$('auto').onchange=savePrefs;$('interval').oninput=()=>{$('interval').setCustomValidity('');stopTimer()};$('interval').onchange=savePrefs;
$('refresh').onclick=()=>load(!config);
$('disconnect').onclick=()=>{invalidate();connected=false;key='';$('key').value='';$('remember').checked=false;const removed=storageRemove(sessionKey);config=null;revision='';snapshot=null;rows=new Map();dirty=false;$('accounts').replaceChildren();$('defaults').replaceChildren();$('runtime').textContent='';$('updated').textContent='';$('save').disabled=true;message(removed?'密钥已清除，自动刷新已停止。':'页面密钥已清除；浏览器阻止了存储清理，请关闭此标签页。',!removed)};
$('save').onclick=async()=>{
 if(busy||!config||!connected)return;busy=true;stopTimer();const epoch=generation;$('save').disabled=true;
 try{const next=structuredClone(config);next.defaults=readFields(defaultFields,$('default-pause').checked);for(const row of rows.values()){if(row.override.checked)next.accounts[row.id]=readFields(row.fields,row.paused.checked);else delete next.accounts[row.id]}
 const result=await api('/policies','PUT',{revision,config:next});if(epoch!==generation)return;config=result.config;revision=result.revision;dirty=false;$('draft-note').textContent='策略已保存。自动刷新仅更新运行状态。';renderEditor();message('策略已保存。');
 }catch(error){if(epoch===generation)failed(error)}finally{if(epoch===generation){busy=false;$('save').disabled=!connected;schedule()}}
};
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopTimer();else if(connected&&$('auto').checked)load(false)});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
window.addEventListener('pagehide',()=>{invalidate();themeObserver?.disconnect()});
window.addEventListener('pageshow',e=>{if(e.persisted){syncTheme();if(parentRoot)themeObserver?.observe(parentRoot,{attributes:true,attributeFilter:['data-theme','class','style']});schedule()}});
try{const prefs=JSON.parse(storageGet(prefsKey)||'null');if(prefs&&Number.isInteger(prefs.seconds)&&prefs.seconds>=1&&prefs.seconds<=300){$('interval').value=prefs.seconds;$('auto').checked=prefs.auto!==false}}catch(_){}
const saved=storageGet(sessionKey);if(saved){key=saved;$('key').value=saved;$('remember').checked=true;load(true)}
})();
</script></body></html>
