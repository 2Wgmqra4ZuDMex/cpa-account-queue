name: Publish development preview
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Test and build
        run: |
          go mod verify
          go test -race -count=3 ./...
          go vet ./...
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath -buildmode=c-shared -o dist/cpa-account-queue.so ./cmd/plugin
          python3 tests/native_smoke.py dist/cpa-account-queue.so
      - name: Package and validate tag
        run: |
          python3 scripts/package_release.py dist/cpa-account-queue.so dist/release
          python3 -c 'import json,os; r=json.load(open("dist/release/registry.json")); assert os.environ["GITHUB_REF_NAME"]=="v"+r["plugins"][0]["version"]'
      - name: Publish immutable preview assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/release/* --verify-tag --prerelease --title "CPA Account Queue $GITHUB_REF_NAME (Development Preview)" --notes "Local per-account queues. Linux amd64 only. Development preview; see README and TESTING.md for validation boundaries. Use this release's registry.json URL as a pinned CPA store source."
