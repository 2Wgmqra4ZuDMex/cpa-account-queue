name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules and formatting
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          test -z "$(gofmt -l internal cmd)"
          go mod verify
      - name: Race tests
        run: go test -race -count=3 -timeout 120s ./...
      - name: Vet
        run: go vet ./...
      - name: Browser UI acceptance
        run: |
          python3 -m venv /tmp/queue-ui-venv
          /tmp/queue-ui-venv/bin/pip install playwright==1.64.1
          /tmp/queue-ui-venv/bin/playwright install --with-deps chromium
          /tmp/queue-ui-venv/bin/python tests/ui_browser.py
      - name: Build native library
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath -buildmode=c-shared -o dist/cpa-account-queue.so ./cmd/plugin
          sha256sum dist/cpa-account-queue.so > dist/checksums.txt
      - name: Native ABI smoke test
        run: python3 tests/native_smoke.py dist/cpa-account-queue.so
      - name: Download pinned CPA host and verify release checksum
        run: |
          mkdir -p host
          curl -fL --retry 3 https://github.com/router-for-me/CLIProxyAPI/releases/download/v8.0.48/CLIProxyAPI_8.0.48_linux_amd64.tar.gz -o host/CLIProxyAPI_8.0.48_linux_amd64.tar.gz
          curl -fL --retry 3 https://github.com/router-for-me/CLIProxyAPI/releases/download/v8.0.48/checksums.txt -o host/checksums.txt
          (cd host && grep 'CLIProxyAPI_8.0.48_linux_amd64.tar.gz$' checksums.txt | sha256sum -c -)
          tar -xzf host/CLIProxyAPI_8.0.48_linux_amd64.tar.gz -C host
      - name: Isolated pinned CPA integration
        run: |
          python3 -m venv /tmp/queue-integration-venv
          /tmp/queue-integration-venv/bin/pip install PyYAML==6.0.3
          /tmp/queue-integration-venv/bin/python tests/host_integration.py "$(find host -maxdepth 2 -type f -iname 'cli*proxy*' ! -name '*.tar.gz' | head -n 1)" dist/cpa-account-queue.so
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpa-account-queue-linux-amd64-dev
          path: |
            dist/cpa-account-queue.so
            dist/checksums.txt
